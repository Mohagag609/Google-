services:
  - type: web
    name: musharaka-pro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: musharaka-db
          property: connectionString
    healthCheckPath: /
    healthCheckGracePeriod: 300

databases:
  - name: musharaka-db
    plan: free
    databaseName: musharaka
    user: musharaka_user