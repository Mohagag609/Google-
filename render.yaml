services:
  - type: web
    name: musharaka-pro
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --keep-alive 2 --max-requests 1000 --max-requests-jitter 100 app:app
    envVars:
      - key: FLASK_ENV
        value: production
    healthCheckPath: /