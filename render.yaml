services:
  - type: web
    name: musharaka-pro
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: musharaka-db
          property: connectionString

databases:
  - name: musharaka-db
    databaseName: musharaka
    user: musharaka
    plan: free