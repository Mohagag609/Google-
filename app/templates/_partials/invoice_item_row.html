<!-- Invoice item row partial for HTMX responses -->
<tr class="invoice-item-row">
    <td class="px-4 py-2">
        <select name="item_id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <option value="">اختر الصنف</option>
            {% for item in items %}
            <option value="{{ item.id }}">{{ item.name }} ({{ item.sku }})</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-2">
        <input type="number" name="qty" step="0.001" min="0" placeholder="الكمية" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </td>
    <td class="px-4 py-2">
        <input type="number" name="unit_cost" step="0.0001" min="0" placeholder="سعر الوحدة" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </td>
    <td class="px-4 py-2">
        <input type="number" name="tax" step="0.01" min="0" placeholder="الضريبة" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="0">
    </td>
    <td class="px-4 py-2">
        <select name="warehouse_id" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            <option value="">اختر المستودع</option>
            {% for warehouse in warehouses %}
            <option value="{{ warehouse.id }}">{{ warehouse.name }}</option>
            {% endfor %}
        </select>
    </td>
    <td class="px-4 py-2">
        <button type="button" onclick="this.closest('tr').remove()" 
                class="px-3 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
            حذف
        </button>
    </td>
</tr>
