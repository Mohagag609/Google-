<!-- Partner link row partial for HTMX responses -->
<tr class="bg-white border-b hover:bg-gray-50">
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
        {{ project_partner.partner.name }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ "%.2f"|format(project_partner.share_pct) }}%
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ "%.2f"|format(project_partner.wallet_balance) }} {{ project.base_currency }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ "%.2f"|format(project_partner.carry_forward_balance) }} {{ project.base_currency }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 space-x-reverse">
        <!-- Deposit Form -->
        <form hx-post="/projects/{{ project.id }}/wallet/{{ project_partner.partner_id }}/deposit" 
              hx-target="#toasts" 
              hx-swap="beforeend"
              class="inline-block">
            <div class="flex space-x-2 space-x-reverse">
                <input type="number" 
                       name="amount" 
                       step="0.01" 
                       min="0" 
                       placeholder="المبلغ" 
                       class="w-20 px-2 py-1 text-xs border border-gray-300 rounded"
                       required>
                <button type="submit" 
                        class="px-2 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700">
                    إيداع
                </button>
            </div>
        </form>
        
        <!-- Withdraw Form -->
        <form hx-post="/projects/{{ project.id }}/wallet/{{ project_partner.partner_id }}/withdraw" 
              hx-target="#toasts" 
              hx-swap="beforeend"
              class="inline-block">
            <div class="flex space-x-2 space-x-reverse">
                <input type="number" 
                       name="amount" 
                       step="0.01" 
                       min="0" 
                       placeholder="المبلغ" 
                       class="w-20 px-2 py-1 text-xs border border-gray-300 rounded"
                       required>
                <button type="submit" 
                        class="px-2 py-1 text-xs bg-red-600 text-white rounded hover:bg-red-700">
                    سحب
                </button>
            </div>
        </form>
    </td>
</tr>
