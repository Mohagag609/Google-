<!-- Stage row partial for HTMX responses -->
<tr class="bg-white border-b hover:bg-gray-50">
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
        {{ stage.name }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ "%.2f"|format(stage.budget) }} {{ project.base_currency }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{ 'bg-green-100 text-green-800' if stage.status == 'open' else 'bg-red-100 text-red-800' }}">
            {{ 'مفتوح' if stage.status == 'open' else 'مغلق' }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        <div id="st-{{ stage.id }}-cost">
            <!-- Cost will be loaded here via HTMX -->
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2 space-x-reverse">
        <button hx-get="/stages/{{ stage.id }}/cost" 
                hx-target="#st-{{ stage.id }}-cost"
                class="text-blue-600 hover:text-blue-900">
            تحديث التكلفة
        </button>
        <button hx-post="/stages/{{ stage.id }}/allocate/by_share" 
                hx-target="#toasts" 
                hx-swap="beforeend"
                class="text-green-600 hover:text-green-900">
            توزيع بالنسب
        </button>
    </td>
</tr>
