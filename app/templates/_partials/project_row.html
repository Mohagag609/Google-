<!-- Project row partial for HTMX responses -->
<tr class="bg-white border-b hover:bg-gradient-to-r hover:from-blue-50 hover:to-indigo-50 transition-all duration-300">
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <span class="text-lg mr-2">🏷️</span>
            <span class="text-sm font-bold text-gray-900 bg-gray-100 px-3 py-1 rounded-full">
                {{ project.code }}
            </span>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <span class="text-lg mr-2">📋</span>
            <span class="text-sm font-semibold text-gray-900">
                {{ project.name }}
            </span>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <span class="text-lg mr-2">💰</span>
            <span class="text-sm font-medium text-gray-700 bg-yellow-100 px-3 py-1 rounded-full">
                {{ project.base_currency }}
            </span>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full {{ 'bg-green-100 text-green-800' if project.status == 'open' else 'bg-red-100 text-red-800' }}">
            {{ '🟢 مفتوح' if project.status == 'open' else '🔴 مغلق' }}
        </span>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center">
            <span class="text-lg mr-2">📅</span>
            <span class="text-sm text-gray-600">
                {{ project.created_at.strftime('%Y-%m-%d') }}
            </span>
        </div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="flex items-center gap-2">
            <a href="/projects/{{ project.id }}" 
               class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white text-xs font-bold py-2 px-4 rounded-lg shadow hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                👁️ عرض
            </a>
            <button onclick="editProject('{{ project.id }}')"
                    class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white text-xs font-bold py-2 px-4 rounded-lg shadow hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                ✏️ تعديل
            </button>
        </div>
    </td>
</tr>
