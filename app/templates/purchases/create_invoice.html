{% extends "layout.html" %}

{% block title %}فاتورة شراء جديدة - نظام إدارة المقاولات{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-3xl font-bold mb-6">فاتورة شراء جديدة</h1>
    
    <form method="POST" action="/purchases/invoices" id="invoice-form">
        <!-- Header Info -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">المشروع</label>
                <select name="project_id" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="">اختر المشروع</option>
                    {% for project in projects %}
                        <option value="{{ project.id }}">{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">المورد</label>
                <select name="supplier_id" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="">اختر المورد</option>
                    {% for supplier in suppliers %}
                        <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">التاريخ</label>
                <input type="date" name="date" value="{{ now().strftime('%Y-%m-%d') }}" required
                       class="w-full px-4 py-2 border rounded-lg">
            </div>
        </div>
        
        <!-- Items Section -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold mb-4">الأصناف</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">الصنف</th>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">الكمية</th>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">سعر الوحدة</th>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">الضريبة</th>
                            <th class="px-4 py-2 text-right text-xs font-medium text-gray-500 uppercase">الإجمالي</th>
                            <th class="px-4 py-2"></th>
                        </tr>
                    </thead>
                    <tbody id="items-container" class="bg-white divide-y divide-gray-200">
                        <!-- Items will be added here -->
                    </tbody>
                </table>
            </div>
            
            <button type="button" onclick="addInvoiceItem()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                + إضافة صنف
            </button>
        </div>
        
        <!-- Total -->
        <div class="border-t pt-4">
            <div class="flex justify-between items-center">
                <span class="text-xl font-semibold">الإجمالي:</span>
                <span id="invoice-total" class="text-2xl font-bold text-blue-600">0.00 ج.م</span>
            </div>
        </div>
        
        <!-- Submit -->
        <input type="hidden" name="item_count" id="item_count" value="0">
        <div class="mt-6 flex justify-end">
            <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 text-lg">
                حفظ الفاتورة
            </button>
        </div>
    </form>
</div>

<script>
let itemCount = 0;
const items = {{ items|tojson if items else '[]'|safe }};

function addInvoiceItem() {
    const container = document.getElementById('items-container');
    const row = document.createElement('tr');
    
    // Build options HTML
    let optionsHTML = '<option value="">اختر الصنف</option>';
    if (items && items.length > 0) {
        items.forEach(item => {
            optionsHTML += `<option value="${item.id}" data-cost="${item.std_cost}">${item.name}</option>`;
        });
    }
    
    row.innerHTML = `
        <td class="px-4 py-2">
            <select name="item_id_${itemCount}" required class="w-full px-2 py-1 border rounded" onchange="updateItemCost(${itemCount})">
                ${optionsHTML}
            </select>
        </td>
        <td class="px-4 py-2">
            <input type="number" name="qty_${itemCount}" step="0.001" required 
                   class="w-24 px-2 py-1 border rounded" onchange="calculateLineTotal(${itemCount})">
        </td>
        <td class="px-4 py-2">
            <input type="number" name="unit_cost_${itemCount}" step="0.0001" required 
                   class="w-24 px-2 py-1 border rounded" onchange="calculateLineTotal(${itemCount})">
        </td>
        <td class="px-4 py-2">
            <input type="number" name="tax_${itemCount}" step="0.01" value="0" 
                   class="w-24 px-2 py-1 border rounded" onchange="calculateLineTotal(${itemCount})">
        </td>
        <td class="px-4 py-2">
            <span id="line_total_${itemCount}" class="font-semibold">0.00</span>
        </td>
        <td class="px-4 py-2">
            <button type="button" onclick="removeInvoiceItem(this)" class="text-red-600 hover:text-red-800">
                حذف
            </button>
        </td>
    `;
    container.appendChild(row);
    itemCount++;
    document.getElementById('item_count').value = itemCount;
}

function removeInvoiceItem(btn) {
    btn.closest('tr').remove();
    calculateInvoiceTotal();
}

function updateItemCost(index) {
    const select = document.querySelector(`select[name="item_id_${index}"]`);
    const costInput = document.querySelector(`input[name="unit_cost_${index}"]`);
    const selectedOption = select.options[select.selectedIndex];
    if (selectedOption && selectedOption.dataset.cost) {
        costInput.value = selectedOption.dataset.cost;
        calculateLineTotal(index);
    }
}

function calculateLineTotal(index) {
    const qty = parseFloat(document.querySelector(`input[name="qty_${index}"]`).value) || 0;
    const unitCost = parseFloat(document.querySelector(`input[name="unit_cost_${index}"]`).value) || 0;
    const tax = parseFloat(document.querySelector(`input[name="tax_${index}"]`).value) || 0;
    const total = (qty * unitCost) + tax;
    document.getElementById(`line_total_${index}`).textContent = total.toFixed(2);
    calculateInvoiceTotal();
}

function calculateInvoiceTotal() {
    let total = 0;
    for (let i = 0; i < itemCount; i++) {
        const lineTotal = document.getElementById(`line_total_${i}`);
        if (lineTotal) {
            total += parseFloat(lineTotal.textContent) || 0;
        }
    }
    document.getElementById('invoice-total').textContent = total.toFixed(2) + ' ج.م';
}

// Add first item row automatically
addInvoiceItem();
</script>
{% endblock %}
