<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الأزرار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8">اختبار الأزرار</h1>
        
        <!-- Test Buttons -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <h2 class="text-2xl font-bold mb-6">أزرار تفاعلية</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Button 1 -->
                <button onclick="testButton1()" 
                        class="bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                    <span class="text-xl">➕</span>
                    اختبار زر 1
                </button>
                
                <!-- Button 2 -->
                <button onclick="testButton2()" 
                        class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                    <span class="text-xl">🔄</span>
                    اختبار زر 2
                </button>
                
                <!-- Button 3 -->
                <button onclick="testButton3()" 
                        class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                    <span class="text-xl">📝</span>
                    اختبار زر 3
                </button>
                
                <!-- Button 4 -->
                <button onclick="testButton4()" 
                        class="bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-600 hover:to-yellow-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                    <span class="text-xl">⚙️</span>
                    اختبار زر 4
                </button>
            </div>
        </div>
        
        <!-- Test Form -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-8">
            <h2 class="text-2xl font-bold mb-6">نموذج اختبار</h2>
            
            <form onsubmit="testForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">الاسم:</label>
                    <input type="text" id="name" required
                           class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">الوصف:</label>
                    <textarea id="description" rows="3"
                              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300"></textarea>
                </div>
                
                <button type="submit" 
                        class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-bold py-3 px-8 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center gap-2">
                    <span class="text-xl">✅</span>
                    إرسال النموذج
                </button>
            </form>
        </div>
        
        <!-- Results -->
        <div id="results" class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold mb-6">النتائج:</h2>
            <div id="output" class="text-gray-600">اضغط على الأزرار لرؤية النتائج...</div>
        </div>
    </div>

    <script>
        function testButton1() {
            showResult('✅ زر 1 تم الضغط عليه بنجاح!');
            showToast('تم الضغط على زر 1', 'success');
        }
        
        function testButton2() {
            showResult('🔄 زر 2 يعمل بشكل مثالي!');
            showToast('زر 2 نشط', 'info');
        }
        
        function testButton3() {
            showResult('📝 زر 3 جاهز للعمل!');
            showToast('زر 3 تم تفعيله', 'success');
        }
        
        function testButton4() {
            showResult('⚙️ زر 4 يعمل بكفاءة!');
            showToast('زر 4 نشط', 'info');
        }
        
        function testForm(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;
            
            showResult(`📝 تم إرسال النموذج:<br><strong>الاسم:</strong> ${name}<br><strong>الوصف:</strong> ${description}`);
            showToast('تم إرسال النموذج بنجاح!', 'success');
        }
        
        function showResult(message) {
            document.getElementById('output').innerHTML = message;
        }
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 z-50 p-4 rounded-xl shadow-2xl max-w-sm transform transition-all duration-500 ${
                type === 'success' ? 'bg-gradient-to-r from-green-500 to-green-600 text-white' : 
                type === 'error' ? 'bg-gradient-to-r from-red-500 to-red-600 text-white' : 
                type === 'info' ? 'bg-gradient-to-r from-blue-500 to-blue-600 text-white' :
                'bg-gradient-to-r from-gray-500 to-gray-600 text-white'
            }`;
            
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'info' ? 'ℹ️' : '📢';
            
            toast.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${icon}</span>
                        <span class="font-semibold">${message}</span>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" class="mr-2 text-white hover:text-gray-200 text-xl font-bold">
                        ×
                    </button>
                </div>
            `;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentElement) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        toast.remove();
                    }, 500);
                }
            }, 3000);
        }
        
        // Add loading states to buttons
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    if (this.type !== 'submit') {
                        const originalText = this.innerHTML;
                        this.innerHTML = '<span class="animate-spin">⏳</span> جاري المعالجة...';
                        this.disabled = true;
                        
                        setTimeout(() => {
                            this.innerHTML = originalText;
                            this.disabled = false;
                        }, 1000);
                    }
                });
            });
        });
    </script>
</body>
</html>
