services:
  - type: web
    name: musharaka-pro-preview
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: musharaka-preview-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: musharaka-preview-db
    plan: free
    databaseName: musharaka_preview
    user: musharaka_preview_user